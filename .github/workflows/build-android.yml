name: build-android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repo checkout
        uses: actions/checkout@v4

      - name: Java 17 setup
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK setup
        uses: android-actions/setup-android@v3

      - name: NDK path fix
        run: |
          if [ -z "$ANDROID_NDK_HOME" ]; then
            echo "ANDROID_NDK_HOME=$(ls -d $ANDROID_HOME/ndk/* | head -1)" >> $GITHUB_ENV
          fi

      - name: llama-server build (arm64)
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp
          cd llama.cpp
          cmake -B build-android \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DGGML_OPENMP=OFF \
            -DLLAMA_CURL=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF
          cmake --build build-android --target llama-server -j4

      - name: Binary copy to app
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp llama.cpp/build-android/bin/llama-server app/src/main/jniLibs/arm64-v8a/libllamaserver.so

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK build
        run: gradle assembleDebug --no-daemon

      - name: APK upload
        uses: actions/upload-artifact@v4
        with:
          name: Naina-Apk
          path: app/build/outputs/apk/debug/app-debug.apk
