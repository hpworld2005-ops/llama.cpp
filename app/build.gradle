
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.naina.ai'
    compileSdk 34

    defaultConfig {
        applicationId "com.naina.ai"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "1.0"
        ndk { abiFilters 'arm64-v8a' }
    }

    packaging {
        jniLibs { useLegacyPackaging true }
    }
}
